name: agentwhich policy check
description: Enforce AI coding-agent instruction policy and optionally upload SARIF to GitHub Code Scanning.
author: ptrgiang

branding:
  icon: eye
  color: blue

inputs:
  policy:
    description: Path to the agentwhich TOML policy file.
    required: false
    default: .agentwhich.toml
  agents:
    description: Optional comma-separated agent override. Policy agents are used when empty.
    required: false
    default: ''
  cwd:
    description: Working directory to resolve instructions from.
    required: false
    default: .
  target:
    description: Optional target path for target-aware instruction rules.
    required: false
    default: ''
  sarif-file:
    description: SARIF output path.
    required: false
    default: agentwhich.sarif
  upload-sarif:
    description: Upload SARIF to GitHub Code Scanning. Requires security-events write permission.
    required: false
    default: 'false'

outputs:
  sarif-file:
    description: Path to the generated SARIF file.
    value: ${{ inputs.sarif-file }}
  exit-code:
    description: agentwhich check exit code (0 pass, 1 policy violation, 2 configuration error).
    value: ${{ steps.check.outputs.exit_code }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install agentwhich
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"

    - name: Run policy check
      id: check
      shell: bash
      env:
        AGENTWHICH_POLICY: ${{ inputs.policy }}
        AGENTWHICH_AGENTS: ${{ inputs.agents }}
        AGENTWHICH_CWD: ${{ inputs.cwd }}
        AGENTWHICH_TARGET: ${{ inputs.target }}
        AGENTWHICH_SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        args=(check --cwd "$AGENTWHICH_CWD" --format sarif --output "$AGENTWHICH_SARIF_FILE")
        if [[ -n "$AGENTWHICH_POLICY" ]]; then
          args+=(--policy "$AGENTWHICH_POLICY")
        fi
        if [[ -n "$AGENTWHICH_AGENTS" ]]; then
          args+=(--agents "$AGENTWHICH_AGENTS")
        fi
        if [[ -n "$AGENTWHICH_TARGET" ]]; then
          args+=(--target "$AGENTWHICH_TARGET")
        fi
        set +e
        agentwhich "${args[@]}"
        code=$?
        set -e
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF
      if: ${{ always() && inputs.upload-sarif == 'true' && steps.check.outputs.exit_code != '2' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: agentwhich

    - name: Enforce policy result
      if: ${{ always() && steps.check.outputs.exit_code != '0' }}
      shell: bash
      env:
        AGENTWHICH_EXIT_CODE: ${{ steps.check.outputs.exit_code }}
      run: exit "$AGENTWHICH_EXIT_CODE"
