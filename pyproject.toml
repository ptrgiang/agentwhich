[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentwhich"
version = "0.1.0"
description = "which + diff for AI coding instructions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ptrgiang" }]
keywords = ["ai", "coding-agents", "codex", "claude-code", "gemini-cli", "developer-tools", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.6"]

[project.scripts]
agentwhich = "agentwhich.cli:main"

[project.urls]
Homepage = "https://github.com/ptrgiang/agentwhich"
Repository = "https://github.com/ptrgiang/agentwhich"
Issues = "https://github.com/ptrgiang/agentwhich/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentwhich"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
